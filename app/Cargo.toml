[package]
name = "pkgmaster"
version = "0.1.3"
edition = "2021"
description = "PS4/PS5 package inspector and PKG-to-ELF converter (desktop app)"
license = "MIT"

[lib]
name = "pkgmaster"
path = "src/lib.rs"

[[bin]]
name = "pkgmaster-gui"
path = "src/main.rs"

[[bin]]
name = "pkgmaster-cli"
path = "src/bin/cli.rs"

[dependencies]
aes = "0.8"
xts-mode = "0.5"
sha2 = "0.10"
sha3 = "0.10"
hmac = "0.12"
flate2 = "1"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
rfd = "0.15"
trash = "5"
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[build-dependencies]
winresource = "0.1"
